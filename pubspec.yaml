name: billfold
description: "A Privacy-Aware Financial Statement Intelligence Assistant."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI Styling & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # State Management & MVVM
  provider: ^6.1.2

  # Backend, Authentication & Database (Supabase)
  supabase_flutter: ^2.8.0

  # Local Biometric Authentication (Face ID / Touch ID)
  local_auth: ^2.1.8

  # API Calls
  http: ^1.2.1

  # Charts & File Handling
  fl_chart: ^0.66.0
  file_selector: ^1.1.0

dependency_overrides:
  app_links: ^7.2.2
  passkeys_windows: ^0.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true